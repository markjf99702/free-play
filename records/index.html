<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="../shared/carry.js"></script>
  <title>Records · Free Play</title>
  <meta name="description" content="Your records at Free Play: the top five on every machine and the day each was set, and every ticket, round and trade since the arcade started counting.">
  <meta property="og:title" content="Records, at Free Play">
  <meta property="og:description" content="An arcade on your phone: eight machines on free play, and a prize counter.">
  <meta property="og:image" content="https://free-play.junkdrawer.works/og.png">
  <meta property="og:image:alt" content="FREE PLAY in pink and teal neon over the line 'An arcade on your phone: eight machines on free play, and a prize counter.' Beside it, screens from the eight machines: skee-ball rings, a pinball table, a claw over a heap of plush, a coin pusher's deck, a stacker's tower, a shooting gallery's ducks and rabbits, moles in their tunnels, and a basketball dropping through the hoop under SWISH! +3.">
  <meta property="og:url" content="https://free-play.junkdrawer.works/records/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0b1f">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="preload" href="../fonts/bungee-outline.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/bungee.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/arcade.css">
  <link rel="stylesheet" href="../css/floor.css">
  <link rel="stylesheet" href="records.css">
  <!-- the crossfade between the floor and the machines (see the end of shared/arcade.css): here on the page itself, as
       a style sheet can still be on its way when the browser decides whether a page crossfades in -->
  <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } ::view-transition-group(root) { animation-duration: .2s; } ::view-transition { pointer-events: none; } }</style>
</head>
<body>
  <header class="door">
    <a class="to-floor" href="../">← Free Play</a>
    <h1 class="sign records-sign">Records</h1>
    <p class="lede">Your best on every machine, and the day you set it.</p>
  </header>

  <main>
    <section class="totals" aria-labelledby="totalsH">
      <h2 id="totalsH">All-time</h2>
      <dl class="tally">
        <div><dt>Tickets won</dt><dd id="totTickets"></dd></div>
        <div><dt>Rounds played</dt><dd id="totRounds"></dd></div>
        <div><dt>Prizes traded</dt><dd id="totTraded"></dd></div>
      </dl>
      <p class="since" id="since"></p>
    </section>

    <div class="recs">
      <section class="rec roll-up" aria-labelledby="recRollUp">
        <h2 class="marquee"><a id="recRollUp" href="../roll-up/">Roll Up</a></h2>
        <div class="body" id="rollUpRec"></div>
      </section>
      <section class="rec tilt" aria-labelledby="recTilt">
        <h2 class="marquee"><a id="recTilt" href="../tilt/">Tilt</a></h2>
        <div class="body" id="tiltRec"></div>
      </section>
      <section class="rec clutch" aria-labelledby="recClutch">
        <h2 class="marquee"><a id="recClutch" href="../clutch/">Clutch</a></h2>
        <div class="body" id="clutchRec"></div>
      </section>
      <section class="rec topple" aria-labelledby="recTopple">
        <h2 class="marquee"><a id="recTopple" href="../topple/">Topple</a></h2>
        <div class="body" id="toppleRec"></div>
      </section>
      <section class="rec highrise" aria-labelledby="recHighrise">
        <h2 class="marquee"><a id="recHighrise" href="../highrise/">Highrise</a></h2>
        <div class="body" id="highriseRec"></div>
      </section>
      <section class="rec popgun" aria-labelledby="recPopgun">
        <h2 class="marquee"><a id="recPopgun" href="../popgun/">Popgun</a></h2>
        <div class="body" id="popgunRec"></div>
      </section>
      <section class="rec bonkers" aria-labelledby="recBonkers">
        <h2 class="marquee"><a id="recBonkers" href="../bonkers/">Bonkers</a></h2>
        <div class="body" id="bonkersRec"></div>
      </section>
      <section class="rec hoops" aria-labelledby="recHoops">
        <h2 class="marquee"><a id="recHoops" href="../hoops/">Hoops</a></h2>
        <div class="body" id="hoopsRec"></div>
      </section>
    </div>
  </main>

  <footer class="jd-foot">
    <a href="https://junkdrawer.works/">Part of junkdrawer.works</a>
    <span aria-hidden="true">·</span>
    <a href="https://junkdrawer.works/privacy.html">Privacy</a>
  </footer>

  <noscript><p class="noscript">Free Play needs JavaScript to read your records.</p></noscript>
  <script type="module" src="records.js"></script>
</body>
</html>
